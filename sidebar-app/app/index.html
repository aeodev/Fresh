<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FreshQA</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-copy"><strong>FreshQA</strong><small id="company"></small></span>
        <span id="mode" class="pill">Loading</span>
        <button id="refresh" class="icon" type="button" aria-label="Refresh conversation">↻</button>
      </header>

      <section id="loading" class="message">Opening this conversation…</section>
      <section id="error" class="message error" hidden><strong>Could not load FreshQA</strong><p id="error-text"></p></section>

      <section id="body" hidden>
        <div class="control">
          <div class="control-copy">
            <strong id="status-title">Agent for this chat</strong>
            <p id="status-copy"></p>
          </div>
          <button id="toggle" class="switch" type="button" role="switch" aria-checked="false" aria-label="Turn on FreshQA for this chat" data-action="enable"><span></span></button>
        </div>

        <div id="attention" class="attention" hidden><span class="attention-dot"></span><span id="attention-text"></span></div>

        <div id="turn" class="turn" hidden>
          <div class="turn-head"><span class="eyebrow">Latest decision</span><span id="turn-decision" class="pill"></span></div>
          <p id="turn-answer"></p>
          <p id="turn-reason" class="muted small"></p>
        </div>

      </section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script src="{{{appclient}}}"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
