# BEGIN FRESHQA KOOYA HTTP
server {
    listen 80;
    listen [::]:80;
    server_name freshqa-kooya.test.kooyaai.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
# END FRESHQA KOOYA HTTP
