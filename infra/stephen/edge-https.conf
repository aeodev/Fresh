# BEGIN FRESHQA KOOYA HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freshqa-kooya.test.kooyaai.com;
    ssl_certificate /etc/letsencrypt/live/freshqa-kooya.test.kooyaai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshqa-kooya.test.kooyaai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://tunnel-nginx:80;
        proxy_read_timeout 300s;
    }
}
# END FRESHQA KOOYA HTTPS
